name: ibmi-toolchain-release

# Builds this branch's Go toolchain once (GOEXPERIMENT=iseriesaix baked in as
# the default) and publishes it as a release asset, so other projects' CI can
# download it instead of running make.bash.
#
#   - push a tag named ibmi-*   -> builds that tag and publishes a release
#   - Run workflow (any branch) -> builds that branch and publishes a release
#                                  named by the "tag" input, targeting its HEAD

on:
  push:
    tags: ['ibmi-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. ibmi-go1.26.9-1)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: go
          fetch-depth: 1

      # Bootstrap compiler only.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false

      - name: Build toolchain
        working-directory: go/src
        env:
          GOEXPERIMENT: iseriesaix
        run: |
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          unset GOROOT
          ./make.bash

      # GOEXPERIMENT is deliberately unset here: the default must be baked in.
      - name: Smoke test (cross-compile for IBM i)
        env:
          GOROOT: ${{ github.workspace }}/go
          GOOS: aix
          GOARCH: ppc64
          CGO_ENABLED: '0'
        run: |
          set -eu
          unset GOEXPERIMENT
          export PATH="$GOROOT/bin:$PATH"
          go version
          go env GOEXPERIMENT
          mkdir /tmp/hello && cd /tmp/hello
          printf 'package main\nfunc main() { println("hi") }\n' > main.go
          go mod init hello
          go build -o hello .
          go version -m hello | tee /tmp/vm.txt
          grep -q iseriesaix /tmp/vm.txt

      - name: Package
        id: pkg
        run: |
          set -eu
          ver=$(head -n1 go/VERSION)
          sha=$(git -C go rev-parse --short=10 HEAD)
          name="go-ibmi-${ver}-${sha}.linux-amd64.tar.gz"
          rm -rf go/.git
          tar -czf "$name" go
          sha256sum "$name" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "IBM i (PASE) Go toolchain, GOEXPERIMENT=iseriesaix default. Host: linux/amd64. Target: GOOS=aix GOARCH=ppc64, CGO_ENABLED=0. Source commit ${{ github.sha }}." \
            "${{ steps.pkg.outputs.name }}" "${{ steps.pkg.outputs.name }}.sha256"
